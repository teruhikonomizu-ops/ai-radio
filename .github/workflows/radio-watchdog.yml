name: radio-watchdog

# ラジオ2番組(tech-radio/news-radio)は「1セット」。
# 本線・保険どちらのcronも終わった後の時間帯に、両番組の当日分が
# ちゃんとRSSに乗っているかを確認する。
#
# 2026-08-28改修(自己修復化): 8/26〜28にGitHub側のスケジュール発火が丸ごと欠落する事象が
# 続いたため、「知らせるだけ」から「欠けていたら workflow_dispatch で自動再実行→
# 最大45分待って復旧確認」に格上げ。メールが来るのは自動再実行でも直らなかった時だけ。
#
# 手動確認: Actionsタブ → radio-watchdog → Run workflow

on:
  schedule:
    - cron: '17 1 * * *'   # 01:17 UTC = 日本時間10:17
                            # (毎時0分はGitHub混雑で発火が飛びやすいため0分を避ける。
                            #  tech/newsの本線+保険3本がすべて終わった後の時間帯)
  workflow_dispatch:

permissions:
  actions: write   # 欠けていた番組を workflow_dispatch で再実行するため

env:
  TZ: Asia/Tokyo
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 両番組の本日分を確認し、欠けていたら自動で再実行
        run: |
          today=$(date +%F)
          echo "本日(JST): $today"

          check() {  # $1=show id。当日分が配信済みなら0
            pubdate=$(curl -fsS "https://teruhikonomizu-ops.github.io/ai-radio/$1/feed.xml" 2>/dev/null | grep -m1 -oP '(?<=<pubDate>).*?(?=</pubDate>)')
            [ "$(date -d "$pubdate" +%F 2>/dev/null)" = "$today" ]
          }

          missing=""
          for id in tech news; do
            if check "$id"; then
              echo "$id: 本日分あり"
            else
              echo "$id: 本日分なし → workflow_dispatchで再実行を発火"
              missing="$missing $id"
            fi
          done
          if [ -z "$missing" ]; then
            echo "両番組とも本日分の配信を確認しました。"
            exit 0
          fi

          for id in $missing; do
            gh workflow run "$id-radio"
          done

          # 生成は1本およそ30分。5分おき・最大9回(45分)だけ待つ(上限なしの完了待ちループは書かない)
          for i in $(seq 1 9); do
            sleep 300
            still=""
            for id in $missing; do
              check "$id" || still="$still $id"
            done
            missing="$still"
            if [ -z "$missing" ]; then
              echo "自動再実行で復旧しました。"
              exit 0
            fi
            echo "待機中($i/9): 未配信=$missing"
          done

          echo "::error::自動再実行でも復旧せず:$missing。tech-radio/news-radioのActionsログを確認してください。"
          exit 1
