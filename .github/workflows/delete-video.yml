name: delete-video

# 誤投稿したYouTube動画を削除する手動専用ユーティリティ。
# 実行: Actionsタブ → delete-video → Run workflow → video_idを入力
#
# ~~既知の制限(2026-08-10): youtube.uploadスコープのみで削除不可~~ は解消。
# 2026-09-28にYOUTUBE_REFRESH_TOKENを範囲"youtube"の合鍵へ入れ替え、
# 2026-09-29にスクリプト側の範囲指定も"youtube"へ揃えた(不一致だとinvalid_scope)。

on:
  workflow_dispatch:
    inputs:
      video_id:
        description: "削除するYouTube動画ID(URLの watch?v= の後ろの部分)"
        required: true

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: YouTube用の部品を入れる（版を固定・鍵はまだ渡さない）
        # 2026-11-08 のみさん承認: 部品の乗っ取り（サプライチェーン攻撃）対策。出たばかりの版は入れない・鍵を持たせた手順の中で部品を入れない。
        run: pip install --no-deps -r requirements-youtube.txt && pip check

      - name: 動画を削除
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python3 scripts/delete_youtube.py "${{ github.event.inputs.video_id }}"
