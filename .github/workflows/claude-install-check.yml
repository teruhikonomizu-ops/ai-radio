name: claude-install-check

# Claude Code の入れ方（scripts/install_claude_code.py）だけを、本番と同じ機械で試す点検用（2026-11-13 新設）。
# 鍵は一切渡さない・何も公開しない・コミットもしない。手で動かした時だけ走る（定時なし）。
# 使いどころ: 入れ方を直した後の確認／news-radio が「Claude Code を入れる」で赤になった時の切り分け。
# 手動実行: gh workflow run claude-install-check -R teruhikonomizu-ops/ai-radio
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: 公式アクション cache が動くか（news.yml と同じ版・中身は空の目印だけ）
        # news.yml の cache は本番でしか走らないので、版を上げた時にここで先に確かめる。版は news.yml とそろえる。
        uses: actions/cache@v5
        with:
          path: .cache-check
          key: claude-install-check-v1

      - name: 落ちた朝と同じ時刻で版選びを試す（2.1.319 を選べば合格）
        # 2026-11-13 朝（11/12 19:05Z）は 2.1.321 の本体だけが3日たっていて、実行ファイルの部品が入らなかった。
        # 同じ時刻を渡して、1つ前の 2.1.319 を選ぶことを確かめる。
        run: |
          out=$(python3 scripts/install_claude_code.py --days 3 --dry-run --now 2026-11-12T19:05:00Z)
          echo "$out"
          echo "$out" | grep -q "入れる版: 2.1.319"

      - name: 落ちた朝と同じ壊れ方をわざと作り、例外にせず「だめ」と判定できるか
        # 「11/09 19:05Z より前に公開された物だけ」で入れる＝11/13 朝と同じ経路で、2.1.321 の本体だけが入り
        # 実行ファイルの部品（19:06:45Z 公開）は入らない（仮置きの claude だけがある状態）。
        # 判定が「だめ」（None）で、切り分けが「部品が入っていない」（False）なら合格。
        # ※ --omit=optional では部品が入ってしまい、壊れた状態を作れなかった（2026-11-13 実測）。
        run: |
          npm install -g @anthropic-ai/claude-code --before=2026-11-09T19:05:00.000Z
          python3 - <<'EOF'
          import shutil, sys
          sys.path.insert(0, "scripts")
          import install_claude_code as m
          r = m.check_claude(shutil.which("claude"), "2.1.321")
          has = m.native_installed()
          print("判定:", r, "／部品が入っているか:", has)
          sys.exit(0 if r is None and has is False else 1)
          EOF

      - name: 今の時刻で実際に入れて、動くことを確かめる（上の壊れた状態からの入れ直しも兼ねる）
        run: |
          npm --version
          python3 scripts/install_claude_code.py --days 3
          claude --version
